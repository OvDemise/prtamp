# Project Reclaimer dedicated.toml - generated by AMP on every start.
# Do not edit this file directly: change settings in AMP's Configuration pages.
# Most settings reach the server as RECLAIMER_DEDICATED_* environment variables,
# which override the values below. One AMP instance runs one server.

game = "game"
content = "content"
data = "data"
bans = "bans.json"
public_address = "{{public_address}}"   # empty: detect
upnp = false
auto_update = false

[master]
enabled = false

[[server]]
name = "{{server.name}}"
port = {{server.port}}
rcon_port = {{server.rcon_port}}
{{server.selection}}
{{server.extra}}
